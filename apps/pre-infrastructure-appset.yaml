apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: pre-infrastructure
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/Nvision-x/nxdeployment-development-env.git
        revision: argocd-sol-2
        files:
          - path: environment.yaml
  template:
    metadata:
      name: "pre-infrastructure-{{ .environment.cluster.name }}"
      annotations:
        argocd.argoproj.io/sync-wave: "-2"
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: nvisionx-development
      destination:
        name: "{{ .environment.cluster.name }}"
        namespace: "{{ .environment.namespace }}"
      sources:
        - repoURL: https://github.com/Nvision-x/nx-application-helm.git
          targetRevision: argocd-sol-2
          path: charts/pre-infrastructure
          helm:
            releaseName: pre-infrastructure
            valueFiles:
              - $envvalues/values.yaml
              - $envvalues/profiles/eks.yaml
        - repoURL: "https://github.com/Nvision-x/nxdeployment-{{ .environment.name }}-env.git"
          targetRevision: argocd-sol-2
          ref: envvalues
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
