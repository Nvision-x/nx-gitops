apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: layers
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  # version + values from each env's environment.yaml
  generators:
    # one matrix per env: cross that env's environment.yaml with the layer list
    - matrix:
        generators:
          - git:
              repoURL: https://github.com/Nvision-x/nxdeployment-development-env.git
              revision: main
              files:
                - path: environment.yaml
          - list:
              elements: &layers
                - { chart: processing-systems, wave: "2" }
    # Integration rolled back to helm (deployment.method defaults to helm in its
    # environment.yaml). Re-enable once integration is cut over to argocd.
    # - matrix:
    #     generators:
    #       - git:
    #           repoURL: https://github.com/Nvision-x/nxdeployment-integration-env.git
    #           revision: main
    #           files:
    #             - path: environment.yaml
    #       - list:
    #           elements: *layers
  template:
    metadata:
      name: "{{ .chart }}-{{ .environment.cluster.name }}"
      annotations:
        argocd.argoproj.io/sync-wave: "{{ .wave }}"
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: nvisionx-development
      destination:
        name: "{{ .environment.cluster.name }}"
        namespace: "{{ .environment.namespace }}"
      sources:
        - repoURL: "{{ .registry.url }}"
          chart: "{{ .chart }}"
          targetRevision: "{{ .registry.defaultVersion }}"
          helm:
            releaseName: "{{ .chart }}"
            valueFiles:
              - $envvalues/values.yaml
              - $envvalues/profiles/eks.yaml
        - repoURL: "https://github.com/Nvision-x/nxdeployment-{{ .environment.name }}-env.git"
          targetRevision: main
          ref: envvalues
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
