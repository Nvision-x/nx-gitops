apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cnpg-operator
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/Nvision-x/nxdeployment-development-env.git
        revision: main
        files:
          - path: environment.yaml
    # Integration: re-enable once development is validated.
    # - git:
    #     repoURL: https://github.com/Nvision-x/nxdeployment-integration-env.git
    #     revision: main
    #     files:
    #       - path: environment.yaml
  template:
    metadata:
      name: "cnpg-operator-{{ .environment.cluster.name }}"
      annotations:
        argocd.argoproj.io/sync-wave: "-3"
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: nvisionx-development
      destination:
        name: "{{ .environment.cluster.name }}"
        namespace: "{{ .environment.namespace }}"
      sources:
        # argocd branch, not OCI. Revert to OCI once merged & published.
        - repoURL: https://github.com/Nvision-x/nx-application-helm.git
          targetRevision: argocd
          path: charts/cnpg-operator
          helm:
            releaseName: cnpg-operator
            valueFiles:
              - $envvalues/values.yaml
              - $envvalues/profiles/eks.yaml
        # Env values from env repo main branch.
        - repoURL: "https://github.com/Nvision-x/nxdeployment-{{ .environment.name }}-env.git"
          targetRevision: main
          ref: envvalues
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
