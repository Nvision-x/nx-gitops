apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: databases
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  # Orphan (don't cascade-delete) deployed resources when a generated
  # Application is removed from this set.
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    # Envs opt in via deployment.method: argocd in their environment.yaml.
    - git:
        repoURL: https://github.com/Nvision-x/nxdeployment-development-env.git
        revision: main
        files:
          - path: environment.yaml
        values:
          method: '{{ dig "deployment" "method" "helm" . }}'
      selector:
        matchLabels:
          values.method: argocd
    - git:
        repoURL: https://github.com/Nvision-x/nxdeployment-integration-env.git
        revision: main
        files:
          - path: environment.yaml
        values:
          method: '{{ dig "deployment" "method" "helm" . }}'
      selector:
        matchLabels:
          values.method: argocd
  template:
    metadata:
      name: "databases-{{ .environment.cluster.name }}"
      annotations:
        argocd.argoproj.io/sync-wave: "0"
    spec:
      project: nvisionx-development
      destination:
        name: "{{ .environment.cluster.name }}"
        namespace: "{{ .environment.namespace }}"
      sources:
        # OCI mainline chart — same artifact the helm workflow installs.
        - repoURL: "{{ .registry.url }}"
          chart: databases
          targetRevision: "{{ .registry.defaultVersion }}"
          helm:
            releaseName: databases
            valueFiles:
              - $envvalues/values.yaml
              - $envvalues/profiles/eks.yaml
        # Env values from env repo main branch.
        - repoURL: "https://github.com/Nvision-x/nxdeployment-{{ .environment.name }}-env.git"
          targetRevision: main
          ref: envvalues
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
      # Chart renders these keys blank (lookup returns nil under ArgoCD render);
      # external-db-config-sync Job fills them in-cluster. Without this, selfHeal
      # reverts them to blank each sync.
      ignoreDifferences:
        - group: ""
          kind: ConfigMap
          name: databases-postgresql-env
          jsonPointers:
            - /data/DB_USERNAME
            - /data/ALERTS_DB_HOST
            - /data/HOST_SERVER
            - /data/NX_MAIN_DB_USERNAME
            - /data/NX_MAIN_HOST_SERVER
        - group: ""
          kind: ConfigMap
          name: databases-opensearch-env
          jsonPointers:
            - /data/ELASTICSEARCH_HOST
            - /data/ELASTICSEARCH_USER
            - /data/OPENSEARCH_URL
        - group: ""
          kind: Secret
          name: databases-postgresql-credentials
          jsonPointers:
            - /data/POSTGRES_PASSWORD
            - /data/DB_PASSWORD
            - /data/DATABASE_PASSWORD
            - /data/NVISNX_PASSWORD
            - /data/NX_MAIN_DB_PASSWORD
        - group: ""
          kind: Secret
          name: databases-opensearch-credentials
          jsonPointers:
            - /data/ELASTICSEARCH_PASSWORD
            - /data/OPENSEARCH_PASSWORD
            - /data/OPENSEARCH_INITIAL_ADMIN_PASSWORD
