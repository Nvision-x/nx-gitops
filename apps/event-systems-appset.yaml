apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: event-systems
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/Nvision-x/nxdeployment-development-env.git
        revision: feat/infrastructure-argocd
        files:
          - path: environment.yaml
  template:
    metadata:
      name: "event-systems-{{ .environment.cluster.name }}"
      # After infrastructure.
      annotations:
        argocd.argoproj.io/sync-wave: "1"
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: nvisionx-development
      destination:
        name: "{{ .environment.cluster.name }}"
        namespace: "{{ .environment.namespace }}"
      sources:
        # From `argocd` branch, not OCI (OCI builds from main). Revert once merged.
        # Deps (pulsar, nats, nack) aren't vendored - repo-server must reach
        # pulsar.apache.org + nats-io.github.io at render time.
        - repoURL: https://github.com/Nvision-x/nx-application-helm.git
          targetRevision: argocd
          path: charts/event-systems
          helm:
            releaseName: event-systems
            valueFiles:
              - $envvalues/values.yaml
              - $envvalues/profiles/eks.yaml
        # Env values from feat branch until merged to main.
        - repoURL: "https://github.com/Nvision-x/nxdeployment-{{ .environment.name }}-env.git"
          targetRevision: feat/infrastructure-argocd
          ref: envvalues
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true  # large pulsar/nats/nack CRDs
