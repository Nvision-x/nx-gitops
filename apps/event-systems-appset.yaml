apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: event-systems
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  # Orphan (don't cascade-delete) deployed resources when a generated
  # Application is removed from this set.
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    # Envs opt in via deployment.method: argocd in their environment.yaml.
    - git:
        repoURL: https://github.com/Nvision-x/nxdeployment-development-env.git
        revision: main
        files:
          - path: environment.yaml
        values:
          method: '{{ dig "deployment" "method" "helm" . }}'
      selector:
        matchLabels:
          values.method: argocd
    - git:
        repoURL: https://github.com/Nvision-x/nxdeployment-integration-env.git
        revision: main
        files:
          - path: environment.yaml
        values:
          method: '{{ dig "deployment" "method" "helm" . }}'
      selector:
        matchLabels:
          values.method: argocd
  template:
    metadata:
      name: "event-systems-{{ .environment.cluster.name }}"
      # After infrastructure.
      annotations:
        argocd.argoproj.io/sync-wave: "1"
    spec:
      project: nvisionx-development
      destination:
        name: "{{ .environment.cluster.name }}"
        namespace: "{{ .environment.namespace }}"
      sources:
        # OCI mainline chart — same artifact the helm workflow installs.
        - repoURL: "{{ .registry.url }}"
          chart: event-systems
          targetRevision: "{{ .registry.defaultVersion }}"
          helm:
            releaseName: event-systems
            valueFiles:
              - $envvalues/values.yaml
              - $envvalues/profiles/eks.yaml
        # Env values from env repo main branch.
        - repoURL: "https://github.com/Nvision-x/nxdeployment-{{ .environment.name }}-env.git"
          targetRevision: main
          ref: envvalues
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true  # large pulsar/nats/nack CRDs
      ignoreDifferences:
        # K8s API defaults volumeMode=Filesystem into the immutable
        # volumeClaimTemplates; the chart omits it -> perpetual OutOfSync.
        - group: apps
          kind: StatefulSet
          jsonPointers:
            - /spec/volumeClaimTemplates
