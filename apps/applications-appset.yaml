apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: applications
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/Nvision-x/nxdeployment-development-env.git
        revision: main
        files:
          - path: environment.yaml
    # Integration held until development is validated. Re-enable to roll out.
    # - git:
    #     repoURL: https://github.com/Nvision-x/nxdeployment-integration-env.git
    #     revision: main
    #     files:
    #       - path: environment.yaml
  template:
    metadata:
      name: "applications-{{ .environment.cluster.name }}"
      annotations:
        # Last layer: deploys after databases (0), event-systems (1) and
        # processing-systems (2) are up.
        argocd.argoproj.io/sync-wave: "3"
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: nvisionx-development
      destination:
        name: "{{ .environment.cluster.name }}"
        namespace: "{{ .environment.namespace }}"
      sources:
        # From `argocd` branch, not OCI (OCI builds from main). Revert once merged.
        - repoURL: https://github.com/Nvision-x/nx-application-helm.git
          targetRevision: argocd
          path: charts/applications
          helm:
            releaseName: applications
            valueFiles:
              - $envvalues/values.yaml
              - $envvalues/profiles/eks.yaml
        # Env values from env repo main branch.
        - repoURL: "https://github.com/Nvision-x/nxdeployment-{{ .environment.name }}-env.git"
          targetRevision: main
          ref: envvalues
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
      # No ignoreDifferences needed: the chart's only in-cluster-dependent
      # resources are Helm hooks (api-key-secret-job PreSync, snowflake register
      # PostSync), which ArgoCD tracks as hooks — not synced/pruned resources.
      # Unlike `databases`, no rendered ConfigMap/Secret is patched post-sync.
