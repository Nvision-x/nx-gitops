apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: observability
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  # values come from each env's environment.yaml
  # separate from layers: needs ServerSideApply (CRDs exceed 262KB)
  generators:
    # one app per env
    - git:
        repoURL: https://github.com/Nvision-x/nxdeployment-development-env.git
        revision: main
        files:
          - path: environment.yaml
    # Integration rolled back to helm (deployment.method defaults to helm in its
    # environment.yaml). Re-enable once integration is cut over to argocd.
    # - git:
    #     repoURL: https://github.com/Nvision-x/nxdeployment-integration-env.git
    #     revision: main
    #     files:
    #       - path: environment.yaml
  template:
    metadata:
      name: "observability-{{ .environment.cluster.name }}"
      annotations:
        argocd.argoproj.io/sync-wave: "-4"
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: nvisionx-development
      destination:
        name: "{{ .environment.cluster.name }}"
        namespace: "{{ .environment.namespace }}"
      sources:
        # argocd branch, not OCI (keeps the refactor off other envs).
        # Revert to OCI once merged & published.
        - repoURL: https://github.com/Nvision-x/nx-application-helm.git
          targetRevision: argocd
          path: charts/observability
          helm:
            releaseName: observability
            valueFiles:
              - $envvalues/values.yaml
              - $envvalues/profiles/eks.yaml
        - repoURL: "https://github.com/Nvision-x/nxdeployment-{{ .environment.name }}-env.git"
          targetRevision: main
          ref: envvalues
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
