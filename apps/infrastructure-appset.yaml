apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: infrastructure
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/Nvision-x/nxdeployment-development-env.git
        revision: feat/infrastructure-argocd
        files:
          - path: environment.yaml
  template:
    metadata:
      name: "infrastructure-{{ .environment.cluster.name }}"
      annotations:
        argocd.argoproj.io/sync-wave: "-5"
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: nvisionx-development
      destination:
        name: "{{ .environment.cluster.name }}"
        namespace: "{{ .environment.namespace }}"
      sources:
        # Chart pulled from the nx-application-helm `argocd` branch, not the
        # published OCI chart - keeps the refactor off other environments.
        # Revert to OCI (registry.url + registry.defaultVersion) once `argocd`
        # is merged and published.
        - repoURL: https://github.com/Nvision-x/nx-application-helm.git
          targetRevision: argocd
          path: charts/infrastructure
          helm:
            releaseName: infrastructure
            valueFiles:
              - $envvalues/values.yaml
              - $envvalues/profiles/eks.yaml
        # Env values pulled from the feat/infrastructure-argocd branch until
        # it's reviewed and merged to main.
        - repoURL: "https://github.com/Nvision-x/nxdeployment-{{ .environment.name }}-env.git"
          targetRevision: feat/infrastructure-argocd
          ref: envvalues
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
      ignoreDifferences:
        - group: networking.k8s.io
          kind: Ingress
          name: infrastructure-alb-ingress
          jsonPointers:
            - /metadata/annotations/alb.ingress.kubernetes.io~1certificate-arn
            - /metadata/annotations/alb.ingress.kubernetes.io~1wafv2-acl-arn
            - /metadata/annotations/alb.ingress.kubernetes.io~1scheme
        - group: ""
          kind: ConfigMap
          name: infrastructure-minio-config
          jsonPointers:
            - /data/MINIO_BUCKET
            - /data/MINIO_APPLICATION_LOGO_BUCKET
            - /data/MINIO_CSV_BUCKET
            - /data/MINIO_LOGO_BUCKET
            - /data/S3_DOWNLOAD_BUCKET
            - /data/MINIO_ENDPOINT
