apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: infrastructure
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  # Orphan (don't cascade-delete) deployed resources when a generated
  # Application is removed from this set.
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    # Envs opt in via deployment.method: argocd in their environment.yaml.
    - git:
        repoURL: https://github.com/Nvision-x/nxdeployment-development-env.git
        revision: main
        files:
          - path: environment.yaml
        values:
          method: '{{ dig "deployment" "method" "helm" . }}'
      selector:
        matchLabels:
          values.method: argocd
    - git:
        repoURL: https://github.com/Nvision-x/nxdeployment-integration-env.git
        revision: main
        files:
          - path: environment.yaml
        values:
          method: '{{ dig "deployment" "method" "helm" . }}'
      selector:
        matchLabels:
          values.method: argocd
  template:
    metadata:
      name: "infrastructure-{{ .environment.cluster.name }}"
      annotations:
        argocd.argoproj.io/sync-wave: "-5"
    spec:
      project: nvisionx-development
      destination:
        name: "{{ .environment.cluster.name }}"
        namespace: "{{ .environment.namespace }}"
      sources:
        # OCI mainline chart — same artifact the helm workflow installs.
        - repoURL: "{{ .registry.url }}"
          chart: infrastructure
          targetRevision: "{{ .registry.defaultVersion }}"
          helm:
            releaseName: infrastructure
            valueFiles:
              - $envvalues/values.yaml
              - $envvalues/profiles/eks.yaml
        # Env values from env repo main branch.
        - repoURL: "https://github.com/Nvision-x/nxdeployment-{{ .environment.name }}-env.git"
          targetRevision: main
          ref: envvalues
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
      ignoreDifferences:
        - group: networking.k8s.io
          kind: Ingress
          name: infrastructure-alb-ingress
          jsonPointers:
            - /metadata/annotations/alb.ingress.kubernetes.io~1certificate-arn
            - /metadata/annotations/alb.ingress.kubernetes.io~1wafv2-acl-arn
            - /metadata/annotations/alb.ingress.kubernetes.io~1scheme
        - group: ""
          kind: ConfigMap
          name: infrastructure-minio-config
          jsonPointers:
            - /data/MINIO_BUCKET
            - /data/MINIO_APPLICATION_LOGO_BUCKET
            - /data/MINIO_CSV_BUCKET
            - /data/MINIO_LOGO_BUCKET
            - /data/S3_DOWNLOAD_BUCKET
            - /data/MINIO_ENDPOINT
        # Kong admission-webhook cert: subchart genCA/genSignedCert + lookup
        # returns nil under ArgoCD -> a new cert every render. Freeze the
        # first-applied, internally-consistent set (both secrets + caBundle).
        - group: ""
          kind: Secret
          name: infrastructure-kong-validation-webhook-ca-keypair
          jsonPointers:
            - /data
        - group: ""
          kind: Secret
          name: infrastructure-kong-validation-webhook-keypair
          jsonPointers:
            - /data
        - group: admissionregistration.k8s.io
          kind: ValidatingWebhookConfiguration
          name: infrastructure-kong-default-validations
          jqPathExpressions:
            - .webhooks[].clientConfig.caBundle
        # Gateway: Kong controller adds the publish-service annotation; the
        # Gateway API webhook defaults group/kind into certificateRefs.
        - group: gateway.networking.k8s.io
          kind: Gateway
          name: default-gateway
          # kong-ingress-controller mutates the Gateway (adds publish-service
          # annotation, defaults group/kind into certificateRefs). Ignore its
          # fields; jsonPointers pin the exact certificateRefs defaults (the
          # earlier jqPathExpressions errored on the no-tls http listener).
          managedFieldsManagers:
            - kong-ingress-controller
          jsonPointers:
            - /metadata/annotations/konghq.com~1publish-service
            - /spec/listeners/1/tls/certificateRefs/0/group
            - /spec/listeners/1/tls/certificateRefs/0/kind
