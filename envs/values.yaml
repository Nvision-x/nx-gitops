# Control-plane overlay for our internal envs. Consumed by apps/control-plane.yaml.
project:
  name: nvisionx-development
  description: Workloads deployed to our internal EKS environments
  sourceRepos:
    - "https://github.com/Nvision-x/*"
    - "https://argoproj.github.io/argo-helm"
    - "ghcr.io/nvision-x"
    - "ghcr.io/nvision-x/*"
    - "ghcr.io/berriai"  # litellm-helm (apps/bedrock-proxy-dev.yaml)
  destinations:
    - name: eks-development
      namespace: "*"
    - name: eks-integration
      namespace: "*"
    - name: eks-demo
      namespace: "*"
    - name: eks-uat
      namespace: "*"

environments:
  - name: development
    envRepo:
      url: https://github.com/Nvision-x/nxdeployment-development-env.git
      revision: main
    # kubectl edits stay until the next deploy resets them (all internal envs)
    selfHeal: false
  - name: integration
    envRepo:
      url: https://github.com/Nvision-x/nxdeployment-integration-env.git
      revision: main
    selfHeal: false
  - name: demo
    envRepo:
      url: https://github.com/Nvision-x/nxdeployment-demo-env.git
      revision: main
    selfHeal: false
  - name: uat
    envRepo:
      url: https://github.com/Nvision-x/nxdeployment-uat-env.git
      revision: main
    selfHeal: false

# Layers that honour an env's selfHeal: false. Stateless and
# rebuildable only; databases, event-systems and infrastructure keep healing.
layers:
  processing-systems:
    allowDrift: true
  observability:
    allowDrift: true
