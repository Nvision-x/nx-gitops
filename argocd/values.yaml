# Values for the argocd wrapper chart (nx-application-helm/charts/argocd).
# Upstream argo-cd is a subchart, so everything nests under `argo-cd:`.
argo-cd:
  global:
    domain: argocd.internal.nvisionx.ai

  configs:
    params:
      server.insecure: true
      # kill sync ops stuck longer than 15m instead of hanging forever
      # (a paused ScaledObject wedged applications-eks-development for 12h on 2026-08-31)
      controller.sync.timeout.seconds: "900"
    cm:
      # upstream health maps a paused ScaledObject to Suspended, which never satisfies
      # a wave/health gate and wedges the sync op; treat paused as Healthy instead
      resource.customizations.health.keda.sh_ScaledObject: |
        local hs = {}
        hs.status = "Progressing"
        hs.message = "Waiting for ScaledObject status"
        if obj.status ~= nil and obj.status.conditions ~= nil then
          for _, condition in ipairs(obj.status.conditions) do
            if condition.type == "Paused" and condition.status == "True" then
              hs.status = "Healthy"
              hs.message = "ScaledObject is paused (autoscaling.keda.sh/paused-replicas)"
              return hs
            end
          end
          for _, condition in ipairs(obj.status.conditions) do
            if condition.type == "Ready" then
              if condition.status == "True" then
                hs.status = "Healthy"
                hs.message = "ScaledObject is ready"
              elseif condition.status == "False" then
                hs.status = "Degraded"
                hs.message = condition.message or "ScaledObject is not ready"
              end
            end
          end
        end
        return hs

  server:
    replicas: 1
    ingress:
      enabled: true
      ingressClassName: alb
      hostname: argocd.internal.nvisionx.ai
      path: /
      pathType: Prefix
      annotations:
        alb.ingress.kubernetes.io/scheme: internal
        alb.ingress.kubernetes.io/inbound-cidrs: 10.4.0.0/16
        alb.ingress.kubernetes.io/target-type: ip
        alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
        alb.ingress.kubernetes.io/ssl-redirect: "443"
        alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-3-2021-06
        alb.ingress.kubernetes.io/backend-protocol: HTTP
        alb.ingress.kubernetes.io/healthcheck-path: /healthz
        alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:787858641133:certificate/908c2ba5-41c3-4b61-ac92-e7dffbd4e087
        alb.ingress.kubernetes.io/group.name: argocd-internal

  controller:
    replicas: 1

  repoServer:
    replicas: 1

  applicationSet:
    replicas: 1

  redis:
    enabled: true

  dex:
    enabled: false

  notifications:
    enabled: false
